# 6minutes firm configuration: the hard facts the agent must obey.
# Policies stack: firm default -> client override -> project override.
# This is the pristine copy; the running app works on state/firm.yaml (reset copies this over).

firm:
  name: Northbeam Advisory
  domain: northbeam.co
  currency: gbp
  policy:
    rate_card: { Partner: 350, Manager: 200, Consultant: 160, Analyst: 120 }
    rounding_hours: 0.1          # R4: 0.1h = 6 minutes
    max_hours_per_day: 10        # R4
    confidence_threshold: 0.7    # R6
    minutes_per_email: 6
    minutes_per_teams_message: 3
    billable_kinds: [call, doc_edit, email, teams]
    staffing_min_hours: 3        # sustained work before proposing an assignment
    staffing_min_days: 2

consultants:
  hannah: { name: Hannah Cole, email: hannah@northbeam.co, title: Manager, avatar: https://randomuser.me/api/portraits/women/44.jpg }
  sam:   { name: Sam Lee,    email: sam@northbeam.co,   title: Analyst, avatar: https://randomuser.me/api/portraits/men/32.jpg }
  jordan: { name: Jordan Blake, email: jordan@northbeam.co, title: Partner, avatar: https://randomuser.me/api/portraits/men/52.jpg }
  maya:  { name: Maya Okafor, email: maya@northbeam.co, title: Manager, avatar: https://randomuser.me/api/portraits/women/68.jpg }
  daniel: { name: Daniel Reyes, email: daniel@northbeam.co, title: Consultant, avatar: https://randomuser.me/api/portraits/men/75.jpg }
  chloe: { name: Chloe Whitfield, email: chloe@northbeam.co, title: Consultant, avatar: https://randomuser.me/api/portraits/women/65.jpg }
  tariq: { name: Tariq Hassan, email: tariq@northbeam.co, title: Analyst, avatar: https://randomuser.me/api/portraits/men/86.jpg }
  elena: { name: Elena Rossi, email: elena@northbeam.co, title: Analyst, avatar: https://randomuser.me/api/portraits/women/17.jpg }

clients:
  acme:
    name: Acme Corp
    billing_email: ap@acme.example
    domains: [acme.com]
  globex:
    name: Globex Industries
    billing_email: finance@globex.example
    domains: [globex.com]
    policy:
      confidence_threshold: 0.75   # client-level override
  brightwater:
    name: Brightwater Utilities
    billing_email: payables@brightwater.example
    domains: [brightwater.com, bwenergy.com]
  kestrel:
    name: Kestrel Pharma
    billing_email: ap@kestrelpharma.example
    domains: [kestrelpharma.com]
  lumen:
    name: Lumen Retail
    billing_email: accounts@lumenretail.example
    domains: [lumenretail.com]

projects:
  ACME-Q3:
    name: Acme Q3 Audit
    client: acme
    code: ACQ3
    po_number: PO-4471
    policy:
      po_cap_gbp: 12600          # R5
    match:
      domains: [acme.com]
      channels: ["#acme-q3"]
      folders: [/Clients/Acme/Q3]
      files: [Acme_Model_v3.xlsx, Acme_Audit_Findings.docx]
    non_billable_threads: []     # R3: filled by manager decisions
    assignments:
      - { consultant: hannah, role: Manager, hours_per_week: 25, start: 2026-09-01, end: 2026-12-31 }
      - { consultant: jordan, role: Partner, hours_per_week: 2, start: 2026-09-01, end: 2026-12-31 }

